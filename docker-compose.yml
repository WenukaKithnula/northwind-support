# SQL Server and the API for local development only. The passwords and the signing key below are
# throwaway local placeholders - never commit a real credential.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: supportdesk-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Local_Dev_Password1}"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - supportdesk-sql:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      # Production on purpose: no Swagger, no development key. It is not baked into the image.
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT_API:-Production}"
      # The service name, not localhost: inside the container localhost is the API itself.
      ConnectionStrings__Default: "Server=sqlserver,1433;Database=SupportDesk;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Local_Dev_Password1};TrustServerCertificate=True;Encrypt=False"
      Jwt__SigningKey: "${JWT_SIGNING_KEY:-local-compose-signing-key-not-a-secret-change-me-32b}"
      # Applies migrations and seeds the demo data on an empty volume. A real deployment would
      # run migrations as its own step instead (see the README).
      Database__MigrateAndSeed: "true"
    ports:
      - "127.0.0.1:5080:8080"

volumes:
  supportdesk-sql:
